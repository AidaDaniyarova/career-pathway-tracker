# Usage:
#   cp .env.docker.example .env      # then fill in real secrets
#   docker compose up --build
# App is served on http://localhost (nginx). Postgres and Redis are not exposed to the host.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-career_tracker}
      POSTGRES_USER: ${DB_USER:-career_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-career_user} -d ${DB_NAME:-career_tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    # CI/CD pushes images to GHCR and the server pulls them (IMAGE_REGISTRY/IMAGE_TAG).
    # Locally, `docker compose up --build` builds and tags them instead.
    image: ${IMAGE_REGISTRY:-local}/career-pathway-tracker-backend:${IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      # Local docker runs over plain HTTP; set to True when TLS terminates in front of nginx
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-False}
      # Set DATABASE_URL (e.g. your Neon pooled URL) to use a hosted database;
      # leave it empty to use the local "db" container below.
      DATABASE_URL: ${DATABASE_URL:-}
      DB_NAME: ${DB_NAME:-career_tracker}
      DB_USER: ${DB_USER:-career_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379
      CACHE_REDIS_URL: redis://redis:6379/1
      WEB_CONCURRENCY: 3
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: ${IMAGE_REGISTRY:-local}/career-pathway-tracker-frontend:${IMAGE_TAG:-latest}
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static:ro
      - media_volume:/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  static_volume:
  media_volume:
