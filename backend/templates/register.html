{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="text-align: center;">Register</h2>

    <div id="errorMessage" style="display: none; background-color: #fee; color: #c00; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>
    <div id="successMessage" style="display: none; background-color: #efe; color: #0a0; padding: 10px; border-radius: 5px; margin-bottom: 15px;"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name">
        </div>

        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name">
        </div>

        <div class="form-group">
            <label for="password">Password * (min 8 characters)</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-group">
            <label for="password_confirm">Confirm Password *</label>
            <input type="password" id="password_confirm" name="password_confirm" required>
        </div>

        <button type="submit" class="btn btn-success" style="width: 100%;">Register</button>
    </form>

    <p style="text-align: center; margin-top: 1rem;">
        Already have an account? <a href="/login/">Login</a>
    </p>
</div>

<script>
    const API_BASE_URL = '/api/users';

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const first_name = document.getElementById('first_name').value.trim();
        const last_name = document.getElementById('last_name').value.trim();
        const password = document.getElementById('password').value;
        const password_confirm = document.getElementById('password_confirm').value;

        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');

        errorDiv.style.display = 'none';
        successDiv.style.display = 'none';

        if (!username || !email || !password) {
            errorDiv.textContent = 'Username, email, and password are required.';
            errorDiv.style.display = 'block';
            return;
        }

        if (password !== password_confirm) {
            errorDiv.textContent = 'Passwords do not match.';
            errorDiv.style.display = 'block';
            return;
        }

        if (password.length < 8) {
            errorDiv.textContent = 'Password must be at least 8 characters.';
            errorDiv.style.display = 'block';
            return;
        }

        const submitBtn = document.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Registering...';
        submitBtn.disabled = true;

        try {
            const response = await fetch(API_BASE_URL + '/register/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username, email, first_name, last_name,
                    password, password_confirm
                })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                if (data.user) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                }

                successDiv.textContent = 'Registration successful! Redirecting to dashboard...';
                successDiv.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/dashboard/';
                }, 1500);
            } else {
                if (typeof data === 'object') {
                    const errors = Object.values(data).flat().join(', ');
                    errorDiv.textContent = errors || 'Registration failed. Please try again.';
                } else {
                    errorDiv.textContent = data.error || data.detail || 'Registration failed.';
                }
                errorDiv.style.display = 'block';
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        } catch (error) {
            console.error('Registration error:', error);
            errorDiv.textContent = 'Network error. Please check if the server is running.';
            errorDiv.style.display = 'block';
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
        }
    });
</script>
{% endblock %}
