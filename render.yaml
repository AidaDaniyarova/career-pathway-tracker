# Render Blueprint: Django API as a free Docker web service.
# Database: Neon (DATABASE_URL). Frontend: Vercel. Redis: not used (optional).
services:
  - type: web
    name: career-pathway-tracker-api
    runtime: docker
    plan: free
    # Closest Render region to the Neon database (aws eu-west-2, London)
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    # Deploy a commit only after its GitHub checks (CI) pass
    autoDeployTrigger: checksPass
    # Frontend-only commits don't rebuild the API
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: WEB_CONCURRENCY
        value: "1"
      # Secrets below: Render asks for them when the Blueprint is created
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
