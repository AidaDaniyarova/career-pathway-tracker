# Weekly PRs for dependency updates; CI runs on each one before you merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor/patch dev updates in one PR. Majors (e.g. TypeScript 7, Tailwind 4)
      # come as separate PRs, so one breaking upgrade can't block the rest.
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Stay on Python 3.13 until psycopg2-binary ships wheels for newer versions
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
