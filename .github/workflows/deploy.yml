name: Deploy

# Production deploys happen only for commits that passed CI on main:
#  - Backend (Render): Render's own "After CI Checks Pass" auto-deploy (render.yaml).
#  - Frontend (Vercel): this workflow, after CI succeeds.
# Vercel's automatic Git deploys for main are off (frontend/vercel.json), so the
# site can't go live ahead of CI. Pull requests still get Vercel preview deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; queue instead of cancelling one halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Deploy frontend to Vercel
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Holds the Vercel secrets; add required reviewers here for a manual approval gate
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit that passed CI
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check Vercel secrets
        run: |
          for v in VERCEL_ORG_ID VERCEL_PROJECT_ID VERCEL_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set in the production environment"; exit 1; fi
          done

      - name: Install Vercel CLI
        run: npm install --global vercel@66.6.0

      # Run from the repo root: the Vercel project's Root Directory is "frontend"
      - name: Pull Vercel project settings and production env (VITE_API_URL)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
